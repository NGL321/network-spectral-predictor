[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nsp"
version = "0.1.0"
description = "Network spectral predictor: a network of small linear predictors on a gated graph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
notebooks = ["matplotlib>=3.8", "nbformat>=5.9", "nbconvert>=7", "nbclient>=0.9", "ipykernel>=6"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
