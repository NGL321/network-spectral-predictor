[world]
omega0 = 2.0   # lone pendulum frequency, rad/s
kappa = 1.0    # spring stiffness / inertia, 1/s^2
dt = 0.05      # sampling step, s
d = 2          # position coordinates per body (2 = spherical: two tilts)

[run]
seeds = [0, 1, 2]

[a6]
n = 8
layouts = 10                   # random layouts per seed
box = 2.0
min_sep = 0.35
chords = 3                     # ring plus 3 chords: 11 live springs among 28 candidate pairs
amplitude = 0.1
windows = [50, 200]            # steps of data the maps are learned from
noise_levels = [0.0, 0.01]
runs = [1, 3]                  # independent runs per window (E5: three runs remove the blind spot)
test_trajectories = 10         # held-out runs on the same layout, for predictions
steps = 200
horizons = [20, 200]
train_sizes = [3, 5]           # step 1's planar maps, learned as in E2
train_trajectories = 10
train_steps = 200
