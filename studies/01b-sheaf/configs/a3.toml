[world]
omega0 = 2.0   # lone pendulum frequency, rad/s
kappa = 1.0    # spring stiffness / inertia, 1/s^2
dt = 0.05      # sampling step, s
d = 2          # position coordinates per body (2 = spherical: two tilts)

[run]
seeds = [0, 1, 2]

[a3]
n = 8                          # bodies per layout
layouts = 10                   # random layouts per seed
box = 2.0
min_sep = 0.35
chords = [0, 3, 5]             # chords added to the ring: 8, 11 and 13 springs (13 = 2n - 3, minimally rigid)
amplitude = 0.1
noise = 0.01                   # measurement noise, fraction of the swing
windows = [20, 50]             # detection windows, steps
floppy_leak = 0.02             # a floppy start: zero-mode motion plus this fraction of random motion
train_sizes = [3, 5]           # step 1's planar maps, learned as in E2, carried through the axes
train_trajectories = 10
train_steps = 200
