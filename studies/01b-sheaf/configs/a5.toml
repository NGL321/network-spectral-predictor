[world]
omega0 = 2.0   # lone pendulum frequency, rad/s
kappa = 1.0    # spring stiffness / inertia, 1/s^2
dt = 0.05      # sampling step, s
d = 2          # position coordinates per body (2 = spherical: two tilts)

[run]
seeds = [0, 1, 2]

[a5]
n = 8                          # pivots on a circle; the ring's 8 springs each lie along their own axis
radius = 1.0                   # circle radius, rod lengths (neighbouring pivots 0.77 apart)
amplitude = 0.1
noise = 0.01
switch_every = 50              # steps between rewirings (2.5 s)
total_steps = 600              # 30 s: 12 wirings per run
kinds = ["pattern", "toggle"]  # a fresh random wiring from the 256, or one spring flipped
trials = 20                    # runs per seed and kind
horizon = 20                   # how far ahead the nominal world predicts (steps; 20 = 1 s)
windows = [20, 50]             # sliding-detection windows (steps)
box = 2.0                      # training layouts, as in A2: rings of 3 and 5 at random, chords by size
train_sizes = [3, 5]
train_chords = [0, 1]
train_layouts = 2
train_min_sep = 0.45
train_trajectories = 10
train_steps = 200
calibration_steps = 2000       # a noisy 5-body run with known gates, for the residual scale
