[world]
omega0 = 2.0   # lone pendulum frequency, rad/s
kappa = 1.0    # spring stiffness / inertia, 1/s^2
dt = 0.05      # sampling step, s
d = 2          # position coordinates per body (2 = spherical: two tilts)

[run]
seeds = [0, 1, 2]

[a2]
amplitude = 0.1                # tilt scale, rod lengths
box = 2.0                      # pivots are drawn in a box x box square (rod lengths)
train_sizes = [3, 5]           # training layouts: rings of 3 and 5 bodies
train_chords = [0, 1]          # chords added to each training ring, by size
train_layouts = 2              # random layouts per size
train_min_sep = 0.45           # closest two pivots may be, rod lengths
train_trajectories = 10
train_steps = 200
test_n = 8                     # test layouts: 8 bodies, never seen
test_chords = 3
test_layouts = 3
test_min_sep = 0.35
test_trajectories = 10
own_trajectories = 10          # separate runs on each test layout, for the reference fitted on the layout itself
steps = 200                    # 10 s rollouts
horizons = [20, 200]           # 1 s and 10 s
planar_graphs = ["path", "ring"]   # step 1's planar maps: learned on these graphs of train_sizes bodies
