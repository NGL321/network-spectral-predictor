[world]
omega0 = 2.0   # lone pendulum frequency, rad/s
kappa = 1.0    # spring stiffness / inertia, 1/s^2
dt = 0.05      # sampling step, s
d = 1          # position coordinates per body (1 = planar)

[run]
seeds = [0, 1, 2]

[h1]
graph = "ring"
n = 8
amplitude = 0.1
p_on = 0.7                     # chance each spring is live in a run's wiring (gates known in H1)
steps = 400                    # 20 s per run
trials = 10                    # runs per seed and condition
noise = 0.01                   # main sense noise on angles, fraction of the swing
noise_levels = [0.001, 0.01, 0.05]
horizon = 20                   # how far ahead the nominal world predicts (steps; 20 = 1 s)
q_levels = [1e-9, 1e-8, 1e-7, 1e-6, 1e-5]   # rate noise the clamp allows for, (rad/s)^2 per step
lambda_grid_max = 8.0
train_sizes = [3, 5]           # step 1's maps, learned on these body counts (as in E2) and then frozen
train_graphs = ["path", "ring"]
train_patterns = 3
train_trajectories = 10
train_steps = 200
