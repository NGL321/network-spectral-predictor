[world]
omega0 = 2.0   # lone pendulum frequency, rad/s
kappa = 1.0    # spring stiffness / inertia, 1/s^2
dt = 0.05      # sampling step, s
d = 1          # position coordinates per body (1 = planar)

[run]
seeds = [0, 1, 2]

[e2]
train_sizes = [3, 5]
train_graphs = ["path", "ring"]
train_patterns = 3       # random gate patterns per graph, after the all-on one
train_trajectories = 10
train_steps = 200
test_n = 8
test_graphs = ["path", "ring", "star", "complete"]
test_trajectories = 10
test_steps = 200
kappas = [1.0, 4.0, 16.0]
amplitude = 0.1
horizons = [10, 50, 200]
lambda_grid_max = 9.0
