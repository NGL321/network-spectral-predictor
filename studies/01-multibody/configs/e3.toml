[world]
omega0 = 2.0   # lone pendulum frequency, rad/s
kappa = 1.0    # spring stiffness / inertia, 1/s^2
dt = 0.05      # sampling step, s
d = 1          # position coordinates per body (1 = planar)

[run]
seeds = [0, 1, 2]

[e3]
graph = "ring"
n = 5
seen = 16                # of the 32 gate patterns, chosen at random per seed
trajectories = 5
steps = 200
test_trajectories = 5
kappas = [1.0, 4.0]
amplitude = 0.1
switch_step = 100
switch_edge = 0          # the spring between bodies 0 and 1 is cut at the switch
