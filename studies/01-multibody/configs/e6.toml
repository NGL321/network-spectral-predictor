[world]
omega0 = 2.0   # lone pendulum frequency, rad/s
kappa = 1.0    # spring stiffness / inertia, 1/s^2
dt = 0.05      # sampling step, s
d = 1          # position coordinates per body (1 = planar)

[run]
seeds = [0, 1, 2]

[e6]
graph = "ring"
n = 5
bank_size = 16           # stored structures, of the 32 gate patterns
hazard = 0.01            # chance per step that the context changes
noise = 0.01
amplitude = 0.1
windows = [1, 2, 3, 5, 10, 20, 50]
static_trials = 100
switch_trials = 20
switch_step = 150
total_steps = 300
sliding_window = 50
novelty_windows = [20, 50, 100]
novelty_trials = 150
false_alarm = 0.01
